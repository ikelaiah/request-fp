<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">How Http.Download keeps files safe</title>
  <desc id="df-desc">Bytes stream from the server into file.zip.part as they arrive, reporting OnProgress with received and total bytes. A complete 2xx response renames the part file to file.zip. An error status, a cancel from the progress callback, or a body shorter than Content-Length deletes the part file and leaves any existing file.zip untouched.</desc>
  <style>
    .bg { fill: #FFFFFF; stroke: #E2E8F0; }
    .t { fill: #0F172A; }
    .m { fill: #475569; }
    .box { fill: #EEF2FF; stroke: #4338CA; }
    .doc { fill: #F8FAFC; stroke: #64748B; }
    .chunk { fill: #818CF8; }
    .ln { stroke: #64748B; fill: none; }
    .ah { fill: #64748B; }
    .prog { fill: #FDF4FF; stroke: #A21CAF; }
    .progt { fill: #86198F; }
    .ok { fill: #ECFDF5; stroke: #059669; }
    .okt { fill: #047857; }
    .err { fill: #FFF1F2; stroke: #E11D48; }
    .errt { fill: #BE123C; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0F172A; stroke: #1E293B; }
      .t { fill: #F1F5F9; }
      .m { fill: #94A3B8; }
      .box { fill: #1E1B4B; stroke: #818CF8; }
      .doc { fill: #1E293B; stroke: #94A3B8; }
      .chunk { fill: #A5B4FC; }
      .ln { stroke: #94A3B8; }
      .ah { fill: #94A3B8; }
      .prog { fill: #3B0A3F; stroke: #E879F9; }
      .progt { fill: #F5D0FE; }
      .ok { fill: #052E24; stroke: #34D399; }
      .okt { fill: #6EE7B7; }
      .err { fill: #3B0712; stroke: #FB7185; }
      .errt { fill: #FDA4AF; }
    }
    text { font-family: Inter, 'Segoe UI', system-ui, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; }
  </style>
  <defs>
    <marker id="df-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="ah"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="338" rx="18" class="bg"/>
  <text x="32" y="44" font-size="20" font-weight="700" class="t">How <tspan class="mono" font-size="18">Http.Download</tspan> keeps files safe</text>

  <!-- Server -->
  <rect x="32" y="146" width="130" height="68" rx="12" class="box" stroke-width="1.5"/>
  <text x="97" y="176" font-size="15" font-weight="700" text-anchor="middle" class="t">Server</text>
  <text x="97" y="196" font-size="12" text-anchor="middle" class="m">response body</text>

  <!-- Stream -->
  <path d="M162 180H372" class="ln" stroke-width="2" marker-end="url(#df-a)"/>
  <rect x="190" y="172" width="22" height="16" rx="3" class="chunk"/>
  <rect x="232" y="172" width="22" height="16" rx="3" class="chunk"/>
  <rect x="274" y="172" width="22" height="16" rx="3" class="chunk"/>
  <rect x="316" y="172" width="22" height="16" rx="3" class="chunk"/>
  <text x="267" y="160" font-size="12.5" text-anchor="middle" class="m">bytes as they arrive</text>
  <text x="267" y="212" font-size="12" text-anchor="middle" class="m">little memory used</text>

  <!-- Part file -->
  <path d="M378 128H500L530 158V232H378Z" class="doc" stroke-width="1.5"/>
  <path d="M500 128V158H530" class="doc" stroke-width="1.5"/>
  <text x="454" y="190" font-size="14" font-weight="700" text-anchor="middle" class="t mono">file.zip.part</text>
  <text x="454" y="210" font-size="11.5" text-anchor="middle" class="m">growing</text>

  <!-- Progress -->
  <rect x="330" y="70" width="248" height="34" rx="17" class="prog" stroke-width="1.5"/>
  <text x="454" y="92" font-size="12.5" font-weight="700" text-anchor="middle" class="progt mono">OnProgress(Received, Total)</text>
  <path d="M454 104V126" class="ln" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Branches -->
  <path d="M530 170C580 170 590 108 640 108" class="ln" stroke-width="2" marker-end="url(#df-a)"/>
  <path d="M530 200C580 200 590 252 640 252" class="ln" stroke-width="2" marker-end="url(#df-a)"/>

  <rect x="644" y="70" width="324" height="84" rx="14" class="ok" stroke-width="1.5"/>
  <text x="664" y="98" font-size="15" font-weight="700" class="okt">Complete 2xx response</text>
  <text x="664" y="120" font-size="12.5" class="m">rename to <tspan class="mono">file.zip</tspan></text>
  <text x="664" y="140" font-size="12.5" class="m">status and headers in the TResponse</text>

  <rect x="644" y="206" width="324" height="96" rx="14" class="err" stroke-width="1.5"/>
  <text x="664" y="234" font-size="15" font-weight="700" class="errt">Error status, cancel, or short body</text>
  <text x="664" y="256" font-size="12.5" class="m">delete <tspan class="mono">file.zip.part</tspan></text>
  <text x="664" y="276" font-size="12.5" class="m">an existing <tspan class="mono">file.zip</tspan> is untouched</text>
  <text x="664" y="294" font-size="12.5" class="m">error body in Response.Text</text>
</svg>
