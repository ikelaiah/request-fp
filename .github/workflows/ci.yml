name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_EXAMPLES: 13

jobs:
  linux:
    name: Linux (Lazarus 4.8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lazarus 4.8 and FPC 3.2.2
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/lazarus-4.8"
          base_url="https://downloads.sourceforge.net/project/lazarus/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8"
          mkdir -p "$install_dir"
          cd "$install_dir"

          curl --fail --location --retry 5 --retry-delay 5 \
            --output fpc-laz.deb \
            "$base_url/fpc-laz_3.2.2-210709_amd64.deb"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output fpc-src.deb \
            "$base_url/fpc-src_3.2.2-210709_amd64.deb"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output lazarus-project.deb \
            "$base_url/lazarus-project_4.8.0-0_amd64.deb"

          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            libssl-dev \
            "$install_dir/fpc-laz.deb" \
            "$install_dir/fpc-src.deb" \
            "$install_dir/lazarus-project.deb"

      - name: Verify compiler versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(fpc -iV)" = "3.2.2"
          test "$(lazbuild --version)" = "4.8"

      - name: Build all examples
        shell: bash
        run: bash ./build-examples.sh

      - name: Verify example outputs
        shell: bash
        run: |
          set -euo pipefail
          output_count="$(find example-bin -maxdepth 1 -type f | wc -l)"
          if [[ "$output_count" -ne "$EXPECTED_EXAMPLES" ]]; then
            echo "Expected $EXPECTED_EXAMPLES example executables, found $output_count." >&2
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: ./run-tests.sh

      - name: Run tests with leak check
        shell: bash
        run: ./run-tests.sh --leak-check

      - name: Load OpenSSL 3 without the -dev package
        shell: bash
        run: |
          set -euo pipefail
          # Remove the unversioned symlinks that libssl-dev provides, so the
          # loader must find libssl.so.3 / libcrypto.so.3 by version.
          lib_dir="/usr/lib/$(gcc -dumpmachine)"
          sudo rm -f "$lib_dir/libssl.so" "$lib_dir/libcrypto.so"
          ./tests/TestRunner --suite=Test25_SSLInitialization --format=plain

  windows:
    name: Windows (Lazarus 4.8)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lazarus 4.8 and FPC 3.2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-4.8-fpc-3.2.2-win64.exe'
          $url = 'https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe'

          curl.exe --fail --location --retry 5 --retry-delay 5 `
            --output $installer `
            $url
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Lazarus installer (exit $LASTEXITCODE)."
          }

          $arguments = @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            '/SP-'
            '/DIR=C:\Lazarus'
          )
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Lazarus installer failed with exit code $($process.ExitCode)."
          }

          'C:\Lazarus' | Out-File -FilePath $env:GITHUB_PATH -Append
          'C:\Lazarus\fpc\3.2.2\bin\x86_64-win64' |
            Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Stage OpenSSL DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredDlls = @(
            'libssl-3-x64.dll'
            'libcrypto-3-x64.dll'
          )

          $opensslDirectory = Join-Path `
            $env:ProgramFiles `
            'OpenSSL\bin'
          if (-not (Test-Path -LiteralPath $opensslDirectory)) {
            throw (
              'The Windows runner OpenSSL directory was not found: ' +
              $opensslDirectory
            )
          }

          foreach ($dllName in $requiredDlls) {
            $source = Join-Path $opensslDirectory $dllName
            if (-not (Test-Path -LiteralPath $source)) {
              throw "The Windows runner did not provide $dllName."
            }
            Copy-Item `
              -LiteralPath $source `
              -Destination .\tests
          }

          $opensslExecutable = Join-Path $opensslDirectory 'openssl.exe'
          if (-not (Test-Path -LiteralPath $opensslExecutable)) {
            throw 'The Windows runner did not provide openssl.exe.'
          }

          # Keep the complete native OpenSSL directory available so Windows
          # can resolve any transitive DLL dependencies at test runtime.
          $opensslDirectory |
            Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$opensslDirectory;$env:PATH"

          & $opensslExecutable version
          if ($LASTEXITCODE -ne 0) {
            throw (
              "OpenSSL version check failed with exit " +
              "code $LASTEXITCODE."
            )
          }

          Write-Output (
            "Staged native OpenSSL 3 DLLs from $opensslDirectory"
          )

      - name: Verify compiler versions
        shell: pwsh
        run: |
          $fpcVersion = (& fpc -iV).Trim()
          $lazarusVersion = (& lazbuild --version).Trim()
          if ($fpcVersion -ne '3.2.2') {
            throw "Expected FPC 3.2.2, found $fpcVersion."
          }
          if ($lazarusVersion -ne '4.8') {
            throw "Expected Lazarus 4.8, found $lazarusVersion."
          }

      - name: Build all examples
        shell: pwsh
        run: .\build-examples.ps1

      - name: Verify example outputs
        shell: pwsh
        run: |
          $outputCount = @(
            Get-ChildItem -LiteralPath .\example-bin -File
          ).Count
          if ($outputCount -ne [int]$env:EXPECTED_EXAMPLES) {
            throw "Expected $env:EXPECTED_EXAMPLES example executables, found $outputCount."
          }

      - name: Run tests
        shell: pwsh
        run: .\run-tests.ps1

      - name: Run tests with leak check
        shell: pwsh
        run: .\run-tests.ps1 -LeakCheck

  macos:
    name: macOS (FPC 3.2.2, Homebrew)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install FPC and OpenSSL 3
        shell: bash
        run: |
          set -euo pipefail
          brew install fpc openssl@3

      - name: Verify compiler version
        shell: bash
        run: |
          set -euo pipefail
          fpc -iV
          test "$(fpc -iV)" = "3.2.2"

      - name: Build all examples
        shell: bash
        run: bash ./build-examples.sh --fpc

      - name: Verify example outputs
        shell: bash
        run: |
          set -euo pipefail
          output_count="$(find example-bin -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$output_count" -ne "$EXPECTED_EXAMPLES" ]]; then
            echo "Expected $EXPECTED_EXAMPLES example executables, found $output_count." >&2
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: ./run-tests.sh --fpc

      - name: Run tests with leak check
        shell: bash
        run: ./run-tests.sh --fpc --leak-check
