# DocSprout managed workflow: github-pages v1
# Generated by DocSprout. Update with `docsprout github-pages --update`.
name: DocSprout Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  documentation:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ikelaiah/docsprout/.github/workflows/publish-docs.yml@v1.5.0
    with:
      versioned: false
      release: latest
    permissions:
      contents: read
      pages: write
      id-token: write
